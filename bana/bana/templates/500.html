{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Erreur serveur | Bana</title>
    <link href="{% static 'bana/img/icon/favicon.ico' %}" rel="icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(-220deg, #0F5F4B 45%, #0ab092 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.35);
        }
        .card img { width: 72px; height: 72px; margin: 0 auto 24px; display: block; }
        .eyebrow {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #007F73;
            margin-bottom: 8px;
        }
        h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; }
        p { color: #595959; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        a.btn {
            display: inline-block;
            padding: 12px 28px;
            background: #007F73;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }
        a.btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <img src="{% static 'bana/img/logo/Bana_logo_dark_green.svg' %}" alt="Bana.mobi">
        <p class="eyebrow">Erreur 500</p>
        <h1>Une erreur est survenue</h1>
        <p>Nos équipes ont été prévenues. Réessayez dans quelques instants — si le problème persiste, contactez-nous.</p>
        <a class="btn" href="/fr/">Retour à l'accueil</a>
    </div>
</body>
</html>
