{% load static %}
<div id="cookie-banner" hidden aria-live="polite" role="region" aria-label="Gestion des cookies">
    <div class="bg-white border-t border-gray-100 shadow-[0_-4px_32px_rgba(0,0,0,0.08)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 md:py-5">
            <div class="flex flex-col sm:flex-row sm:items-center gap-4">

                <!-- Texte -->
                <div class="flex items-start gap-3 flex-1 min-w-0">
                    <img src="{% static 'bana/img/icon/icon-cookie.png' %}" alt="Cookie" class="w-10 h-10 shrink-0 object-contain">
                    <div>
                        <p class="text-sm font-semibold text-gray-900">Bana utilise des cookies</p>
                        <p class="text-xs text-gray-500 mt-0.5 leading-relaxed">
                            Nous utilisons uniquement des cookies essentiels au fonctionnement du service&nbsp;: session, sécurité et préférence de langue. Aucun cookie publicitaire.
                            <a href="{% static 'bana/doc/politique-de-cookies-bana.pdf' %}" target="_blank" rel="noopener"
                               class="underline underline-offset-2 text-[#007F73] hover:text-[#006660] transition-colors ml-1">
                                Politique de cookies&nbsp;→
                            </a>
                        </p>
                    </div>
                </div>

                <!-- Boutons -->
                <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto">
                    <button id="cookie-refuse"
                            type="button"
                            class="flex-1 sm:flex-none px-4 py-2 text-xs font-medium text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 hover:border-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-300">
                        Continuer sans accepter
                    </button>
                    <button id="cookie-accept"
                            type="button"
                            class="flex-1 sm:flex-none px-5 py-2 text-xs font-semibold text-white bg-[#007F73] rounded-lg hover:bg-[#006660] active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-[#007F73] focus:ring-offset-1">
                        Tout accepter
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
